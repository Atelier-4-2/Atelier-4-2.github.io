<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 브리프 — Atelier 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('atelier-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    @font-face {
      font-family: "Instrument Sans"; font-style: normal; font-weight: 600; font-display: swap;
      src: url(./fonts/instrument-sans-latin-600-normal.woff2) format("woff2");
    }
    :root {
      color-scheme: light;
      --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --divider: #d2d2d7;
      --surface: #f5f5f7; --paper: #ffffff; --background: #ffffff;
      --btn-bg: #1d1d1f; --btn-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --ink: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --divider: #48484a;
        --surface: #1d1d1f; --paper: #111113; --background: #000000;
        --btn-bg: #f5f5f7; --btn-ink: #111113;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --divider: #48484a;
      --surface: #1d1d1f; --paper: #111113; --background: #000000;
      --btn-bg: #f5f5f7; --btn-ink: #111113;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--background); color: var(--ink);
      font: 16px/1.6 "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      border-bottom: 1px solid var(--divider); padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      max-width: 860px; margin: 0 auto;
    }
    .brand {
      font-family: "Instrument Sans", sans-serif; font-weight: 600; font-size: 18px;
      text-decoration: none; color: var(--ink);
    }
    .actions { display: inline-flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 980px; border: 1px solid var(--line); background: var(--paper);
      color: var(--ink); font: inherit; font-size: 13px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); }
    main { max-width: 860px; margin: 36px auto 64px; padding: 0 20px; }
    .card {
      border: 1px solid var(--line); border-radius: 20px; background: var(--paper);
      padding: 32px;
    }
    .eyebrow {
      margin: 0 0 8px; font-family: "Instrument Sans", sans-serif;
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 40px); line-height: 1.2; letter-spacing: -.025em; }
    .sub { margin: 0 0 20px; font-size: 16px; color: var(--muted); }
    .note {
      margin: 0 0 24px; padding: 16px 18px; border-radius: 14px;
      background: var(--surface); font-size: 15px; white-space: pre-wrap;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .pill {
      padding: 4px 11px; border-radius: 980px; border: 1px solid var(--line);
      background: var(--surface); font-size: 12px; font-weight: 600; color: var(--muted);
    }
    .link-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .qr-box {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    }
    .qr-preview {
      width: 112px; height: 112px; padding: 8px; border-radius: 12px;
      background: #ffffff; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .qr-preview svg { width: 100%; height: 100%; display: block; }
    .qr-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .qr-info strong { font-size: 14px; }
    .qr-info p { margin: 0; font-size: 13px; color: var(--muted); }
    .form-grid { display: grid; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .field input, .field textarea {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--divider);
      background: var(--background); color: var(--ink); font: inherit; font-size: 14px;
    }
    .field textarea { min-height: 92px; resize: vertical; }
    .hint { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    @media print {
      header, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .card { border: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">← Atelier 4·2</a>
    <div class="actions">
      <button type="button" class="btn" id="toggleEditBtn">편집</button>
      <button type="button" class="btn" id="printBtn">PDF 인쇄</button>
      <button type="button" class="btn primary" id="copyUrlBtn">공유 링크 복사</button>
    </div>
  </header>

  <main>
    <article class="card" id="viewCard">
      <p class="eyebrow">Atelier 4·2 · Project Brief</p>
      <h1 id="vTitle">프로젝트 브리프 카드</h1>
      <p class="sub" id="vSub">스튜디오 · 학기 · 작성자</p>
      <div class="pills" id="vPills"></div>
      <p class="note" id="vNote" hidden></p>
      <div class="link-grid" id="vLinks"></div>
      <div class="qr-box" id="qrBox" hidden>
        <div class="qr-preview" id="qrPreview" aria-label="QR Code"></div>
        <div class="qr-info">
          <strong id="qrTitle">패널 부착용 QR 코드 (SVG)</strong>
          <p id="qrDesc">A0·A1 패널 구석에 붙여두면 스캔만으로 이 브리프와 3D·도면 폴더가 열립니다.</p>
          <div class="actions">
            <button type="button" class="btn" id="qrDownloadBtn">QR SVG 다운로드</button>
          </div>
        </div>
      </div>
    </article>

    <section class="card no-print" id="editCard" hidden style="margin-top:20px">
      <h2 style="margin:0 0 14px;font-size:18px" id="editHeading">프로젝트 브리프 만들기</h2>
      <form class="form-grid" id="briefForm">
        <div class="field">
          <label for="fTitle" id="lTitle">프로젝트 이름</label>
          <input id="fTitle" type="text" maxlength="80" placeholder="예: Traverse des Communs — Romainville S6" required>
        </div>
        <div class="field">
          <label for="fSub" id="lSub">부제 · 학기 · 작성자</label>
          <input id="fSub" type="text" maxlength="100" placeholder="예: ENSA Paris-Belleville · S6 · 2026">
        </div>
        <div class="field">
          <label for="fNote" id="lNote">프로젝트 요약 (개념 · 산출물 메모)</label>
          <textarea id="fNote" maxlength="600" placeholder="교수님·팀원에게 전달할 짧은 설명과 도면 구성을 적어주세요."></textarea>
        </div>
        <div class="field">
          <label for="fDrive" id="lDrive">자료 폴더 링크 (Google Drive / Share)</label>
          <input id="fDrive" type="url" placeholder="https://drive.google.com/...">
        </div>
        <div class="actions">
          <button type="submit" class="btn primary" id="btnBuild">브리프 카드 생성 · 링크 복사</button>
        </div>
      </form>
      <p class="hint" id="editHint">모든 내용은 URL 해시에만 담기며, 서버에 저장되지 않습니다.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    const lang = (() => {
      try { const s = localStorage.getItem('atelier-lang'); if (s === 'fr' || s === 'ko') return s; } catch (e) {}
      return (navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'ko';
    })();
    document.documentElement.lang = lang;

    const L = lang === 'fr' ? {
      edit: 'Modifier', print: 'Imprimer PDF', copy: 'Copier le lien', copied: 'Lien copié',
      buildHeading: 'Créer une fiche projet partageable',
      lTitle: 'Nom du projet', lSub: 'Sous-titre · Semestre · Auteur',
      lNote: 'Résumé du projet (concept · livrables)', lDrive: 'Lien du dossier (Google Drive / Share)',
      btnBuild: 'Générer & copier le lien',
      hint: 'Tout est encodé dans le lien (URL) : aucune donnée n’est stockée sur un serveur.',
      openDrive: 'Ouvrir les fichiers (Drive) ›', openShare: 'Share', openView: 'View 3D', openBoard: 'Board', openCrit: 'Crit',
      sampleTitle: 'Exemple — Atelier 4·2 Project Brief',
      sampleSub: 'ENSA · Studio d’architecture · 2026',
      sampleNote: 'Rassemblez en une seule page votre dossier Drive, vos planches et vos outils 4·2 pour les envoyer par lien à votre enseignant ou votre équipe.',
      qrTitle: 'QR code vectoriel pour planche (SVG)',
      qrDesc: 'Placez ce QR code sur votre planche A0/A1 pour ouvrir cette fiche et vos fichiers depuis un téléphone.',
      qrDl: 'Télécharger QR SVG',
    } : {
      edit: '편집', print: 'PDF 인쇄', copy: '공유 링크 복사', copied: '링크 복사됨',
      buildHeading: '프로젝트 브리프 카드 만들기',
      lTitle: '프로젝트 이름', lSub: '부제 · 학기 · 작성자',
      lNote: '프로젝트 요약 (개념 · 산출물 메모)', lDrive: '자료 폴더 링크 (Google Drive / Share)',
      btnBuild: '브리프 생성 · 링크 복사',
      hint: '모든 내용은 공유 URL 안에만 담기며, 별도 서버에 저장되지 않습니다.',
      openDrive: '자료 폴더 열기 (Drive) ›', openShare: 'Share', openView: 'View 3D', openBoard: 'Board', openCrit: 'Crit',
      sampleTitle: '예시 — Atelier 4·2 프로젝트 브리프',
      sampleSub: '건축 설계 스튜디오 · 2026',
      sampleNote: '교수님이나 팀원에게 폴더 링크만 던지는 대신, 프로젝트 요약과 도면·3D 뷰어·패널 링크를 한 장의 깔끔한 카드로 묶어 공유할 수 있습니다.',
      qrTitle: '패널 부착용 벡터 QR 코드 (SVG)',
      qrDesc: 'A0·A1 패널 구석에 붙여두면 스캔만으로 이 브리프와 3D·도면 폴더가 열립니다.',
      qrDl: 'QR SVG 다운로드',
    };

    document.getElementById('toggleEditBtn').textContent = L.edit;
    document.getElementById('printBtn').textContent = L.print;
    document.getElementById('copyUrlBtn').textContent = L.copy;
    document.getElementById('editHeading').textContent = L.buildHeading;
    document.getElementById('lTitle').textContent = L.lTitle;
    document.getElementById('lSub').textContent = L.lSub;
    document.getElementById('lNote').textContent = L.lNote;
    document.getElementById('lDrive').textContent = L.lDrive;
    document.getElementById('btnBuild').textContent = L.btnBuild;
    document.getElementById('editHint').textContent = L.hint;
    document.getElementById('qrTitle').textContent = L.qrTitle;
    document.getElementById('qrDesc').textContent = L.qrDesc;
    document.getElementById('qrDownloadBtn').textContent = L.qrDl;

    let currentQrSvg = '';
    function renderQr(url) {
      const box = document.getElementById('qrBox');
      const prev = document.getElementById('qrPreview');
      if (!box || !prev || typeof window.qrcode !== 'function') return;
      try {
        const qr = window.qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        const svg = qr.createSvgTag({ scalable: true, margin: 2 });
        currentQrSvg = svg;
        prev.innerHTML = svg;
        box.hidden = false;
      } catch (e) {
        box.hidden = true;
      }
    }

    document.getElementById('qrDownloadBtn').addEventListener('click', () => {
      if (!currentQrSvg) return;
      const blob = new Blob([currentQrSvg], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const safe = (document.getElementById('vTitle').textContent || 'atelier-brief').replace(/[^a-zA-Z0-9가-힣_-]+/g, '_');
      a.download = `${safe}_QR.svg`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    function decodeHash() {
      const h = location.hash.slice(1);
      if (!h) return null;
      try {
        return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h)))));
      } catch (e) { return null; }
    }

    function encodeData(obj) {
      return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
    }

    function render(data) {
      const d = data || { title: L.sampleTitle, subtitle: L.sampleSub, note: L.sampleNote, driveUrl: '', counts: {} };
      document.title = `${d.title} — Atelier 4·2`;
      document.getElementById('vTitle').textContent = d.title || L.sampleTitle;
      document.getElementById('vSub').textContent = d.subtitle || '';
      const noteEl = document.getElementById('vNote');
      noteEl.textContent = d.note || '';
      noteEl.hidden = !d.note;

      const pills = document.getElementById('vPills');
      pills.innerHTML = '';
      if (d.counts && typeof d.counts === 'object') {
        [['Board', d.counts.board], ['Crit', d.counts.crit], ['3DM', d.counts.models], ['Files', d.counts.files]]
          .filter(([, n]) => n > 0)
          .forEach(([k, n]) => {
            const s = document.createElement('span');
            s.className = 'pill';
            s.textContent = `${k} ${n}`;
            pills.appendChild(s);
          });
      }

      const links = document.getElementById('vLinks');
      links.innerHTML = '';
      if (d.driveUrl && /^https?:\/\//i.test(d.driveUrl)) {
        const a = document.createElement('a');
        a.className = 'btn primary'; a.href = d.driveUrl; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = L.openDrive;
        links.appendChild(a);
      }
      [
        [L.openShare, 'https://atelier-4-2.github.io/share/'],
        [L.openView,  'https://atelier-4-2.github.io/view/'],
        [L.openBoard, 'https://atelier-4-2.github.io/board/'],
        [L.openCrit,  'https://atelier-4-2.github.io/crit/'],
      ].forEach(([label, url]) => {
        const a = document.createElement('a');
        a.className = 'btn'; a.href = url; a.textContent = label;
        links.appendChild(a);
      });

      document.getElementById('fTitle').value = data ? (data.title || '') : '';
      document.getElementById('fSub').value = data ? (data.subtitle || '') : '';
      document.getElementById('fNote').value = data ? (data.note || '') : '';
      document.getElementById('fDrive').value = data ? (data.driveUrl || '') : '';
      renderQr(location.href);
    }

    const initial = decodeHash();
    render(initial);
    if (!initial) document.getElementById('editCard').hidden = false;

    document.getElementById('toggleEditBtn').addEventListener('click', () => {
      const ec = document.getElementById('editCard');
      ec.hidden = !ec.hidden;
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('copyUrlBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        const b = document.getElementById('copyUrlBtn');
        b.textContent = L.copied;
        setTimeout(() => { b.textContent = L.copy; }, 1600);
      } catch (e) {}
    });

    document.getElementById('briefForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('fTitle').value.trim(),
        subtitle: document.getElementById('fSub').value.trim(),
        note: document.getElementById('fNote').value.trim(),
        driveUrl: document.getElementById('fDrive').value.trim(),
      };
      location.hash = encodeData(payload);
      render(payload);
      document.getElementById('editCard').hidden = true;
      try { await navigator.clipboard.writeText(location.href); } catch (err) {}
    });
  </script>
</body>
</html>
